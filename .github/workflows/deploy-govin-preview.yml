name: Deploy GOVIN branch preview

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.ref == 'feature/govin-303-v04'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}govin-preview/
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-site

      - name: Checkout GOVIN PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: govin-site

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build current main site
        working-directory: main-site
        run: |
          npm install
          npm run build

      - name: Make GOVIN the preview start screen
        working-directory: govin-site
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          old = "const [activeView, setActiveView] = useState<AppView>('home');"
          new = "const [activeView, setActiveView] = useState<AppView>('direction-check');"
          if old not in s:
              raise SystemExit('Expected activeView initializer not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Build GOVIN preview
        working-directory: govin-site
        run: |
          npm install
          npm run build -- --base=/invitro/govin-preview/

      - name: Combine current site and GOVIN preview
        run: |
          mkdir -p combined/govin-preview
          cp -R main-site/dist/. combined/
          cp -R govin-site/dist/. combined/govin-preview/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./combined

      - name: Deploy combined Pages site
        id: deployment
        uses: actions/deploy-pages@v4
